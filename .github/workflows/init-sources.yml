name: Initialize editable LP sources

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/init-sources.yml"
      - "tools/init_sources.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Split index.html into editable sources
        run: python tools/init_sources.py
      - name: Commit editable source structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src build SOURCE_WORKFLOW.md index.html
          if git diff --cached --quiet; then
            echo "Editable source structure already initialized."
          else
            git commit -m "Initialize editable LP source workflow"
            git pull --rebase origin main
            git push
          fi
